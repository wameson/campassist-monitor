name: Deploy Lambda

# Redeploys the function CODE on merge to main. Deliberately `push`, never
# `schedule`: the drift bug being fixed (PLAN.md Phase 17) only affects
# `schedule` triggers, and deploy timing is not time-sensitive. This workflow
# creates no AWS infrastructure — the Lambda, role, schedule, alarm and SNS
# topic are the operator's one-time console setup.
on:
  push:
    branches: [main]
    paths:
      - 'lambda_function.py'
      - 'scripts/**'
      - 'requirements.txt'
      - 'Makefile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write   # mint the OIDC token for the short-lived AWS role
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # Fail clearly if the operator has not set the deploy config, rather than
      # silently no-op'ing. Role ARN is a secret; function name/region/retention
      # are repo variables. These names are referenced, never invented.
      - name: Check required deploy config
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          : "${AWS_DEPLOY_ROLE_ARN:?set repo secret AWS_DEPLOY_ROLE_ARN (OIDC role scoped to lambda:UpdateFunctionCode)}"
          : "${LAMBDA_FUNCTION_NAME:?set repo variable LAMBDA_FUNCTION_NAME}"
          : "${AWS_REGION:?set repo variable AWS_REGION}"

      - name: Build deployment zip
        run: make lambda-zip

      - name: Configure AWS credentials (OIDC, short-lived)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update function code
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://build/monitor-lambda.zip

      # Lambda's default log retention is Never-Expire; set it deliberately.
      # Best-effort: on a brand-new function the log group does not exist until
      # the first invocation, so a failure here must not fail the deploy.
      - name: Set CloudWatch log retention
        continue-on-error: true
        run: |
          aws logs put-retention-policy \
            --log-group-name "/aws/lambda/${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --retention-in-days "${{ vars.LOG_RETENTION_DAYS || 30 }}" \
          || echo "::warning::log group not present yet; retention applies after first invocation"
