name: Secret scan
# Fails a PR if gitleaks finds a credential in the commits it introduces.
# Complements (does not replace) GitHub's free push protection on the public
# repo — see README "Secret scanning". Runs in well under a minute on this repo.
on:
  pull_request:

permissions:
  contents: read

# One run per PR; a new push cancels the previous scan so we never pay twice.
concurrency:
  group: secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          # Need base..head reachable so we can scan exactly the PR's commits.
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -sSL "$url" -o "$tarball"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan commits introduced by this PR
        run: |
          set -euo pipefail
          # git mode over just base..head: scan what the PR adds, not all of
          # history (that is the one-time pre-public gate) and not merge noise.
          # gitleaks exits non-zero on a finding, which fails the check.
          gitleaks git \
            --config .gitleaks.toml \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --redact \
            --verbose
